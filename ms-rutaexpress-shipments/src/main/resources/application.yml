server:
  port: 8082

spring:
  application:
    name: ms-rutaexpress-shipments
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Nombres de la mensajeria centralizados: el codigo los lee desde aqui
# (MessagingProperties), nunca como strings sueltos.
app:
  messaging:
    exchange: rutaexpress.shipments.exchange
    routing-keys:
      shipment-created: shipment.created
      shipment-status-changed: shipment.status.changed
