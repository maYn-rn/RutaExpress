server:
  port: 8082

spring:
  application:
    name: ms-rutaexpress-shipments
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Nombres de la mensajeria centralizados: el codigo los lee desde aqui
# (MessagingProperties), nunca como strings sueltos. Topologia:
#   cmd.direct (direct) -> email.send | warehouse.ticket | label.gen
#   cmd.topic  (topic)  -> email.<estado> (cola q.cmd.email via email.*)
# Las colas q.cmd.* y sus DLQ las declara ms-rutaexpress-notifications.
app:
  messaging:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
    routing-keys:
      # Envio registrado: aviso al cliente
      email-send: email.send
      # Cambio de estado: se publica como "email.<estado>" (ej. email.entregado)
      email-status-prefix: email
      # Envio ACEPTADO: ticket de picking en bodega
      warehouse-ticket: warehouse.ticket
      # Envio registrado: guia de despacho / etiqueta
      label-gen: label.gen
