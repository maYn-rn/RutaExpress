server:
  port: 8083

spring:
  application:
    name: ms-rutaexpress-notifications
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notifications_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # ACK manual: cada consumidor confirma (ack), rechaza (reject) o
        # devuelve (nack) explicitamente cada mensaje.
        acknowledge-mode: manual
        prefetch: 5

# ============================================================
#  Topologia RabbitMQ (6 colas: 3 flujos + 3 DLQ).
#  RabbitMessagingConfig declara estos recursos al arrancar y
#  los @RabbitListener leen los nombres de colas desde aqui.
#
#  | Cola principal  | DLQ                 | Binding direct   | Binding topic |
#  |-----------------|---------------------|------------------|---------------|
#  | q.cmd.email     | q.cmd.email.dlq     | email.send       | email.*       |
#  | q.cmd.warehouse | q.cmd.warehouse.dlq | warehouse.ticket | warehouse.#   |
#  | q.cmd.label     | q.cmd.label.dlq     | label.gen        | label.*       |
# ============================================================
app:
  messaging:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    # Reintentos ante errores recuperables antes de enviar a la DLQ
    max-retries: 3
    # Si el nombre del cliente contiene este texto, el envio del email
    # falla a proposito (para demostrar reintentos + DLQ + notificacion FALLIDA)
    simulated-failure-keyword: "#fallo"
    email:
      queue: q.cmd.email
      direct-key: email.send
      topic-pattern: "email.*"
      dead-letter-queue: q.cmd.email.dlq
      dead-letter-key: email.dlq
    warehouse:
      queue: q.cmd.warehouse
      direct-key: warehouse.ticket
      topic-pattern: "warehouse.#"
      dead-letter-queue: q.cmd.warehouse.dlq
      dead-letter-key: warehouse.dlq
    label:
      queue: q.cmd.label
      direct-key: label.gen
      topic-pattern: "label.*"
      dead-letter-queue: q.cmd.label.dlq
      dead-letter-key: label.dlq
