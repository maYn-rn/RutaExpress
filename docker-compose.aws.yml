# Despliegue en AWS EC2. La base de datos NO corre aqui: es una instancia
# Amazon RDS (MySQL) cuyo endpoint se define en .env (ver .env.aws.example).
#
# Uso (en la EC2, desde la raiz del repo):
#   cp .env.aws.example .env   # y completar valores reales
#   docker compose -f docker-compose.aws.yml up -d --build
#
# Hacia afuera solo se publican el BFF (8080) y el panel web de RabbitMQ
# (15672, abrir en el Security Group solo para "Mi IP"). El resto de los
# microservicios y el puerto AMQP (5672) quedan en la red interna de Docker.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rutaexpress-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  catalog:
    build: ./ms-rutaexpress-catalog
    container_name: rutaexpress-catalog
    restart: unless-stopped
    environment:
      DB_HOST: ${RDS_HOST}
      DB_PORT: ${RDS_PORT:-3306}
      DB_NAME: ${CATALOG_DB_NAME:-catalog_db}
      DB_USER: ${RDS_USER}
      DB_PASSWORD: ${RDS_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx256m -Djava.net.preferIPv4Stack=true
    expose:
      - "8081"

  shipments:
    build: ./ms-rutaexpress-shipments
    container_name: rutaexpress-shipments
    restart: unless-stopped
    environment:
      DB_HOST: ${RDS_HOST}
      DB_PORT: ${RDS_PORT:-3306}
      DB_NAME: ${SHIPMENTS_DB_NAME:-shipments_db}
      DB_USER: ${RDS_USER}
      DB_PASSWORD: ${RDS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx256m -Djava.net.preferIPv4Stack=true
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - "8082"

  notifications:
    build: ./ms-rutaexpress-notifications
    container_name: rutaexpress-notifications
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: ${RDS_HOST}
      DB_PORT: ${RDS_PORT:-3306}
      DB_NAME: ${NOTIFICATIONS_DB_NAME:-notifications_db}
      DB_USER: ${RDS_USER}
      DB_PASSWORD: ${RDS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx256m -Djava.net.preferIPv4Stack=true
    expose:
      - "8083"

  rabbit-admin:
    build: ./ms-rutaexpress-rabbit-admin
    container_name: rutaexpress-rabbit-admin
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx192m
    expose:
      - "8084"

  bff:
    build: ./ms-rutaexpress-bff
    container_name: rutaexpress-bff
    restart: unless-stopped
    depends_on:
      - catalog
      - shipments
      - notifications
      - rabbit-admin
    environment:
      AZURE_AD_ISSUER_URI: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
      AZURE_AD_AUDIENCE: ${AZURE_CLIENT_ID}
      CATALOG_SERVICE_URL: http://catalog:8081
      SHIPMENTS_SERVICE_URL: http://shipments:8082
      NOTIFICATIONS_SERVICE_URL: http://notifications:8083
      RABBIT_ADMIN_SERVICE_URL: http://rabbit-admin:8084
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JAVA_TOOL_OPTIONS: -Xmx256m -Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"

volumes:
  rabbitmq_data:
