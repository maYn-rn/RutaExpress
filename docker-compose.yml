# Entorno LOCAL: MySQL y RabbitMQ en Docker + los 5 microservicios.
# Uso: docker compose up --build   (desde la raiz del repo)
# Para AWS usar docker-compose.aws.yml.

services:
  mysql:
    image: mysql:8
    container_name: rutaexpress-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: catalog_db
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: catalog_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rutaexpress-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"     # AMQP (microservicios)
      - "15672:15672"   # Panel web: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  catalog:
    build: ./ms-rutaexpress-catalog
    container_name: rutaexpress-catalog
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: catalog_db
      DB_USER: catalog_user
      DB_PASSWORD: catalog_pass
    ports:
      - "8081:8081"

  shipments:
    build: ./ms-rutaexpress-shipments
    container_name: rutaexpress-shipments
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: catalog_db
      DB_USER: catalog_user
      DB_PASSWORD: catalog_pass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
    ports:
      - "8082:8082"

  notifications:
    build: ./ms-rutaexpress-notifications
    container_name: rutaexpress-notifications
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: catalog_db
      DB_USER: catalog_user
      DB_PASSWORD: catalog_pass
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
    ports:
      - "8083:8083"

  rabbit-admin:
    build: ./ms-rutaexpress-rabbit-admin
    container_name: rutaexpress-rabbit-admin
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
    ports:
      - "8084:8084"

  bff:
    build: ./ms-rutaexpress-bff
    container_name: rutaexpress-bff
    depends_on:
      - catalog
      - shipments
      - notifications
      - rabbit-admin
    environment:
      AZURE_AD_ISSUER_URI: https://login.microsoftonline.com/${AZURE_TENANT_ID:-9a929219-a0de-43ee-8628-b1821809e400}/v2.0
      AZURE_AD_AUDIENCE: ${AZURE_CLIENT_ID:-c00f97ec-90e5-442b-905f-fe9641efd268}
      CATALOG_SERVICE_URL: http://catalog:8081
      SHIPMENTS_SERVICE_URL: http://shipments:8082
      NOTIFICATIONS_SERVICE_URL: http://notifications:8083
      RABBIT_ADMIN_SERVICE_URL: http://rabbit-admin:8084
      FRONTEND_ORIGIN: http://localhost:3000
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  rabbitmq_data:
